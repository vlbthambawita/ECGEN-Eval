[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ecgen-eval"
dynamic = ["version"]
description = "Evaluation metrics and interactive reports for synthetic ECG quality assessment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.6"
authors = [
    { name = "Vajira Thambawita", email = "vajira@simula.no" },
]
keywords = ["ecg", "electrocardiogram", "synthetic data", "evaluation", "generative models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.19",
    "pandas>=0.25",
    "plotly>=5.18",
    "click>=7.0",
    "jinja2>=2.11",
    "tqdm>=4.40",
    "scikit-learn>=0.24",
    "dtaidistance>=2.3",
]

[project.urls]
Homepage = "https://github.com/vlbthambawita/ECGEN-Eval"
Repository = "https://github.com/vlbthambawita/ECGEN-Eval"
Issues = "https://github.com/vlbthambawita/ECGEN-Eval/issues"

[project.optional-dependencies]
features = [
    "neurokit2>=0.2",
    "scipy>=1.7",
]
fed = [
    "torch>=2.0",
    "transformers>=4.40",
    "huggingface_hub>=0.22",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
ecgen-eval = "ecgen_eval.cli:main"

[tool.hatch.version]
source = "vcs"   # reads version from the git tag (e.g. v0.1.0 → 0.1.0)

[tool.hatch.build.targets.wheel]
packages = ["ecgen_eval"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
