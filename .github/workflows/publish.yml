name: Publish to PyPI

on:
  push:
    tags:
      - "v*"   # triggers on v0.1.0, v1.2.3, etc.

jobs:
  # ---------------------------------------------------------------
  # 1. Run the test suite before publishing
  # ---------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]"
          pip install scipy  # optional but exercised in tests

      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------
  # 2. Build sdist + wheel
  # ---------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test   # only build if tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution with twine
        run: |
          pip install twine
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------
  # 3. Publish to PyPI via Trusted Publishing (OIDC — no API token)
  # ---------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi   # optional: require manual approval in GitHub

    permissions:
      id-token: write   # required for Trusted Publishing

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------
  # 4. Rebuild the docs so the version badge shows the new tag
  #    (the docs build triggered by the release commit runs before the
  #    tag exists; Pages only deploys from main, so dispatch it there)
  # ---------------------------------------------------------------
  docs:
    name: Rebuild documentation
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      actions: write

    steps:
      - name: Trigger the docs workflow on main
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
